org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# ⚠️⚠️ Jetifier **必须保持 true** —— 2026-09-24 实测关掉会构建失败，别改。
#
# 曾以为依赖生态早就全 AndroidX、Jetifier 是纯浪费，于是关掉试了一次，
# 结果 `:app:checkReleaseDuplicateClasses` 直接失败：
#
#   Duplicate class android.support.v4.app.INotificationSideChannel found in
#     androidx.core:core:1.18.0
#     com.android.support:support-compat:26.1.0
#
# 根因是**传递依赖**：`flutter_baidu_mapapi_map` 的 android/build.gradle 里写着
#
#   implementation 'android.arch.lifecycle:extensions:1.1.1'   ← 2018 年的 pre-AndroidX 包
#
# 它会拖进 `com.android.support:support-compat:26.1.0`（2017 年的包）。
# 关掉 Jetifier 后这些旧 support 类不再被重写成 androidx，就和 androidx.core
# 自带的同名兼容桩类撞了。
#
# ⚠️ 排查时注意：只 grep 包名 `android.support.` **查不出来**（那 3 处命中全是
# AndroidX 自己也在用的兼容字符串），必须 grep Maven 坐标 `com.android.support:`
# 或直接翻各插件 android/build.gradle 的 implementation 行。
#
# 要真正关掉它，得先排除 `android.arch.lifecycle` 再补 AndroidX 等价物
# （`androidx.lifecycle:lifecycle-extensions`），而百度地图**运行时真的在用**
# 这些类 —— 搞不好会破坏位置签到（核心功能）。收益未经实测，风险不划算，故维持原状。
android.enableJetifier=true

# 插件子项目被强制 compileSdk 37，AGP 8.11.1 未正式测试该版本，抑制相关警告
android.suppressUnsupportedCompileSdk=37
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# ---- Gradle 性能开关（2026-09-24 加，用于压缩 CI 构建时间）----
# 构建缓存：命中时直接复用上次的 task 输出，跳过重编译。
# 需要 CI 侧用 actions/cache / setup-java 的 cache:gradle 持久化
# `~/.gradle/caches`（build-cache-1 就在里面）才能跨 run 命中。
org.gradle.caching=true
# 并行执行任务。模块间无依赖时 Gradle 可以同时跑多个 task。
org.gradle.parallel=true
