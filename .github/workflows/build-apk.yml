name: Build Release APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: "true"

      - name: Generate test keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/anerycoft.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias anerycoft \
            -storepass android -keypass android \
            -dname "CN=test, OU=test, O=test, L=test, ST=test, C=CN"
          printf 'storePassword=android\nkeyPassword=android\nkeyAlias=anerycoft\nstoreFile=../anerycoft.jks\n' > android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: course-helper-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

