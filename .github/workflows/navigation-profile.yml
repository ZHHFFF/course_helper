name: Navigation Profile comparison
on:
  workflow_dispatch:
  push:
    branches: [codex/miuix-navigation]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate: [before, native500, 280-240, 300-260, 320-280]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Prepare desktop profile tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb mesa-utils
          python3 -m venv /tmp/navigation-profile-tools
          /tmp/navigation-profile-tools/bin/pip install websocket-client
          echo '/tmp/navigation-profile-tools/bin' >> "$GITHUB_PATH"
      - name: Capture Profile frames and VM timeline
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          SOURCE="$PWD"
          if [ "$CANDIDATE" = before ]; then
            git worktree add --detach /tmp/navigation-baseline 6514c8f6d62758e71033def63f53d28121c3255c
            SOURCE=/tmp/navigation-baseline
          fi
          tool/run_navigation_profile.sh "$SOURCE" "$PWD" "$PWD/profile-results/$CANDIDATE" "$CANDIDATE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-profile-${{ matrix.candidate }}
          path: profile-results/
